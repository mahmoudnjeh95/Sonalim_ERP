services:
  app:
    image: ghcr.io/smarttoolsagro/erpsonalim-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://erp:${POSTGRES_PASSWORD:-erp}@postgres:5432/erp}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://erp:${RABBITMQ_PASSWORD:-erp}@rabbitmq:5672/}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost}
      # Pending schema migrations are applied on startup (under an advisory lock, so
      # app and worker never run them twice). Migrations never carry test/demo data --
      # core/migrations/test_migration_data_guard.py enforces that. Set AUTO_MIGRATE=false
      # in the server .env to go back to applying `python -m scripts.migration_sql` by hand.
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      OCR_URL: ${OCR_URL:-http://ocr:8100}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: ghcr.io/smarttoolsagro/erpsonalim-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 10s
      timeout: 5s

  worker:
    image: ghcr.io/smarttoolsagro/erpsonalim-backend:${IMAGE_TAG:-latest}
    command: ["python", "-m", "worker.main"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://erp:${POSTGRES_PASSWORD:-erp}@postgres:5432/erp}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://erp:${RABBITMQ_PASSWORD:-erp}@rabbitmq:5672/}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      OCR_URL: ${OCR_URL:-http://ocr:8100}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ocr:
    image: ghcr.io/smarttoolsagro/erpsonalim-ocr:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # CPU-only server shared with the ERP: one photo at a time, capped.
    mem_limit: 1536m
    cpus: 2
    environment:
      OMP_NUM_THREADS: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: erp
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-erp}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  grafana_data: