name: Tests

# Runs on every pull request and on pushes to main, and is called by the deploy
# workflow: a deploy only starts once this passes.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/erp
      PGPASSWORD: erp
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create schemas and apply every migration
        run: |
          psql -h localhost -U erp -d erp -v ON_ERROR_STOP=1 -q -f docker/postgres/init.sql
          python -c "from core.migrations.runner import apply_all_migrations; apply_all_migrations()"

      - name: Seed demo data
        run: python -m scripts.seed_dev

      - name: Run tests
        run: python -m pytest -q -rs 2>&1 | tee pytest.log

      # The db fixture skips instead of failing when it finds no migrated database,
      # so a green run could mean nothing was tested. Refuse that.
      - name: Refuse a run that skipped the database tests
        run: |
          if grep -q "no reachable database" pytest.log; then
            echo "::error::integration tests were skipped: the test database was not reachable or not migrated"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc -b

      - name: Run tests
        run: npm test
