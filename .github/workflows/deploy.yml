name: Build and Deploy

# main is the only branch: every push to it is tested, built and deployed to the VPS.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cutting it off.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: smarttoolsagro
  BACKEND_IMAGE: ghcr.io/smarttoolsagro/erpsonalim-backend
  FRONTEND_IMAGE: ghcr.io/smarttoolsagro/erpsonalim-frontend
  OCR_IMAGE: ghcr.io/smarttoolsagro/erpsonalim-ocr

jobs:
  # Nothing is built or deployed unless the backend and frontend tests pass.
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push OCR image
        uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: ./ocr
          push: true
          tags: |
            ${{ env.OCR_IMAGE }}:latest
            ${{ env.OCR_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # tools/backup: the backup and restore scripts cron runs (docs/backups.md). The
      # server's tools/backup/backup.env is not in git, so the copy never touches it.
      - name: Copy compose file and backup scripts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "compose.yaml,tools/backup"
          target: "/home/debian/Sonalim_erp/Erpsonalim"
          overwrite: true

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            umask 077
            cd /home/debian/Sonalim_erp/Erpsonalim
            # The new app applies pending migrations to the live database on start, so take
            # a dump first and stop the deploy if it fails (docs/backups.md, "Pre-deploy dumps").
            B=/home/debian/sonalim-erp-backups
            mkdir -p "$B" && chmod 700 "$B"
            f="$B/pre-deploy_$(date -u +%Y%m%dT%H%M%SZ).dump"
            docker compose exec -T postgres pg_dump -U erp -d erp --format=custom > "$f"
            test -s "$f" || { echo "::error::pre-deploy dump is empty, not deploying"; exit 1; }
            echo "pre-deploy dump $f ($(du -h "$f" | cut -f1))"
            ls -1 "$B" | python3 tools/backup/retention.py --prefix pre-deploy --keep-daily 10 --keep-weekly 0 --keep-monthly 0 \
              | sed "s|^|$B/|" | xargs -r rm -f -- || echo "::warning::old pre-deploy dumps not pruned"
            echo "${{ secrets.SECRET_SONALIM }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            docker compose pull app worker web
            docker compose up -d app worker web
            docker compose pull ocr && docker compose up -d ocr || echo "::warning::OCR image not pulled or started; scanned photos stay queued"
            docker image prune -f
