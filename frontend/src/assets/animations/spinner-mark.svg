<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-hidden="true">
<style>
  .sonalim-spin-ring{transform-origin:50px 50px;animation:sonalim-spin 1.1s linear infinite}
  .sonalim-spin-inner{transform-origin:50px 50px;animation:sonalim-spin-reverse 1.7s linear infinite}
  @keyframes sonalim-spin{to{transform:rotate(360deg)}}
  @keyframes sonalim-spin-reverse{to{transform:rotate(-360deg)}}
  @media(prefers-reduced-motion:reduce){.sonalim-spin-ring,.sonalim-spin-inner{animation:none}}
</style>
<circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="6" opacity=".18"/>
<g class="sonalim-spin-ring"><path d="M50 10a40 40 0 0 1 40 40" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></g>
<g class="sonalim-spin-inner"><path d="M50 24a26 26 0 0 0-26 26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6" opacity=".7"/></g>
<g transform="translate(43.3 58.8) scale(.35)" fill="none" stroke="currentColor" stroke-linecap="round" opacity=".9">
  <path d="M-32 20c-6-29 0-51 19-70 18 23 25 45 16 70" stroke-width="6"/>
  <path d="M-18 4 6-15M-20 18 7 0M-15-12 2-25" stroke-width="5"/>
  <rect x="18" y="-5" width="52" height="18" rx="9" transform="rotate(-28)" fill="currentColor" stroke="none"/>
</g>
</svg>
