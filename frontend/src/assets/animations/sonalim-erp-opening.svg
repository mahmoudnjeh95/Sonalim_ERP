<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-label="Sonalim ERP opening animation">
<style>
  .bg{fill:url(#bg)}
  .logo{animation:logoIn .8s cubic-bezier(.2,.8,.2,1) .15s both}
  .word{animation:wordIn .65s ease .55s both}
  .tag{animation:fade .6s ease 1.1s both}
  .orbit{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.7s ease .25s forwards}
  .pasta{animation:float 2.2s ease-in-out infinite}
  .bar{animation:load 2.5s cubic-bezier(.2,.8,.2,1) .9s forwards}
  .status{animation:fade .5s ease 1.1s both}
  @keyframes logoIn{from{opacity:0;transform:translateY(20px) scale(.75)}to{opacity:1;transform:none}}
  @keyframes wordIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
  @keyframes load{from{width:0}to{width:720px}}
  @media(prefers-reduced-motion:reduce){.logo,.word,.tag,.orbit,.pasta,.bar,.status{animation:none}.bar{width:720px}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071F43"/><stop offset="1" stop-color="#123B6D"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F5A900"/><stop offset="1" stop-color="#FFD45A"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1440" height="900" class="bg"/>
<circle cx="720" cy="420" r="300" fill="#fff" opacity=".035"/>
<path d="M90 580 C350 430 530 450 720 515 C930 590 1100 600 1350 450" fill="none" stroke="#F5A900" stroke-width="5" opacity=".85" class="orbit"/>
<path d="M160 270 C430 120 690 180 900 255 C1080 320 1190 280 1300 205" fill="none" stroke="#F5A900" stroke-width="3" opacity=".5"/>
<g transform="translate(720 330)" class="logo" filter="url(#glow)">
  <g>
    <path d="M-58 24c-8-38 0-67 25-92 25 30 34 61 22 92" fill="none" stroke="#F5A900" stroke-width="8" stroke-linecap="round"/>
    <path d="M-38 1l31-25M-39 19l33-24M-34-16l24-18" stroke="#F5A900" stroke-width="6" stroke-linecap="round"/>
    <path d="M22 17c-20-8-28-28-16-45 21 3 33 18 29 39-2 4-7 7-13 6z" fill="none" stroke="#F5A900" stroke-width="7"/>
    <path d="M10 0c12-9 20-18 26-31" fill="none" stroke="#F5A900" stroke-width="5" stroke-linecap="round"/>
  </g>
</g>
<g class="word" font-family="Inter,Arial,sans-serif">
  <text x="720" y="470" text-anchor="middle" font-size="88" font-weight="700" fill="#fff">Sonalim <tspan fill="#F5A900">ERP</tspan></text>
  <text x="720" y="515" text-anchor="middle" font-size="25" fill="#D9E6F5" letter-spacing="3" class="tag">PRODUCTION  •  QUALITÉ  •  PERFORMANCE</text>
</g>
<g class="pasta" transform="translate(0 0)" fill="#F5A900" opacity=".95">
  <g transform="translate(450 600) rotate(-18)"><rect x="-55" y="-18" width="110" height="36" rx="18"/><path d="M-35-8h70M-35 0h70M-35 8h70" stroke="#C98000" stroke-width="4"/></g>
  <g transform="translate(990 585) rotate(18)"><rect x="-55" y="-18" width="110" height="36" rx="18"/><path d="M-35-8h70M-35 0h70M-35 8h70" stroke="#C98000" stroke-width="4"/></g>
</g>
<text x="720" y="690" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" fill="#fff" class="status">Démarrage de l'application...</text>
<rect x="360" y="735" width="720" height="8" rx="4" fill="#35597E"/>
<rect x="360" y="735" width="0" height="8" rx="4" fill="url(#gold)" class="bar"/>
<text x="720" y="785" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#AFC4DA">Initialisation des modules Sonalim ERP</text>
</svg>
