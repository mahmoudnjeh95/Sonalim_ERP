<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Sonalim ERP">
<style>
  .sonalim-mark-orbit{stroke-dasharray:553;stroke-dashoffset:553;animation:sonalim-mark-draw 1.6s ease .1s forwards}
  @keyframes sonalim-mark-draw{to{stroke-dashoffset:0}}
  @media(prefers-reduced-motion:reduce){.sonalim-mark-orbit{animation:none}}
</style>
<circle cx="100" cy="100" r="88" fill="none" stroke="currentColor" stroke-width="3" opacity=".18"/>
<circle class="sonalim-mark-orbit" cx="100" cy="100" r="88" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" transform="rotate(-90 100 100)"/>
</svg>
