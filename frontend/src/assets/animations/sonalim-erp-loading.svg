<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Sonalim ERP loading animation">
<style>
  .ring{transform-origin:180px 180px;animation:spin 1.2s linear infinite}
  .inner{transform-origin:180px 180px;animation:spinReverse 1.8s linear infinite}
  .p1{animation:pulse 1.1s ease-in-out infinite}
  .p2{animation:pulse 1.1s ease-in-out .18s infinite}
  .p3{animation:pulse 1.1s ease-in-out .36s infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinReverse{to{transform:rotate(-360deg)}}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}
  @media(prefers-reduced-motion:reduce){.ring,.inner,.p1,.p2,.p3{animation:none}}
</style>
<circle cx="180" cy="180" r="130" fill="#F7F9FC"/>
<circle cx="180" cy="180" r="112" fill="none" stroke="#DDE7F0" stroke-width="10"/>
<g class="ring"><path d="M180 68a112 112 0 0 1 112 112" fill="none" stroke="#F5A900" stroke-width="10" stroke-linecap="round"/></g>
<g class="inner"><path d="M180 90a90 90 0 0 0-90 90" fill="none" stroke="#123B6D" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 14"/></g>
<g transform="translate(180 180)">
  <path d="M-32 20c-6-29 0-51 19-70 18 23 25 45 16 70" fill="none" stroke="#F5A900" stroke-width="6" stroke-linecap="round"/>
  <path d="M-18 4 6-15M-20 18 7 0M-15-12 2-25" stroke="#F5A900" stroke-width="5" stroke-linecap="round"/>
  <rect x="18" y="-5" width="52" height="18" rx="9" fill="#F5A900" transform="rotate(-28)"/>
</g>
<circle cx="150" cy="300" r="6" fill="#123B6D" class="p1"/>
<circle cx="180" cy="300" r="6" fill="#F5A900" class="p2"/>
<circle cx="210" cy="300" r="6" fill="#123B6D" class="p3"/>
</svg>
